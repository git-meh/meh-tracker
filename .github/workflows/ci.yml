name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type Check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun ci

      - name: Type check
        run: bun run tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/meh_tracker_ci
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          JOB_INGESTION_API_KEY: ci-job-ingestion-key
          CRON_SECRET: ci-cron-secret
        run: bun run build
