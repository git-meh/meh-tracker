name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type Check & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: bun

      - name: Install dependencies
        run: bun ci

      - name: Type check
        run: bun run tsc --noEmit

      - name: Lint
        run: bun run lint
